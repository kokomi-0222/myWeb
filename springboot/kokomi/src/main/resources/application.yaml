app:
  base-url: http://localhost:8080
  upload-path: ${user.dir}/upload/
  # upload/temp 的过期清理（TempFileCleanupTask，每周扫一次）
  upload-cleanup:
    # 总开关。想手动接管（比如要先把文件捞出来备份）就设 false
    enabled: ${UPLOAD_CLEANUP_ENABLED:true}
    # 保留多少小时以内的临时文件。配图上传先落 temp、提交时才 move 进 images，
    # 所以这里只影响「传了没提交」的残留；正在编辑的图（刚上传）不会被删。
    # 别设太小：用户可能晚上传好、第二天再发帖。被删了帖子仍能发，只是图没了。
    retention-hours: ${UPLOAD_CLEANUP_RETENTION_HOURS:24}
    # Spring 6 段 cron（秒 分 时 日 月 周），默认每周一凌晨 4:17。
    # 想改成每天凌晨 4:17 就写 "0 17 4 * * *"；每周日 3:30 写 "0 30 3 * * SUN"
    cron: "${UPLOAD_CLEANUP_CRON:0 17 4 * * MON}"
  mail:
    # 邮件里署的发件人名
    from-name: 心海的小窝
    # 本地开发用：SMTP 没配时，把验证码明文放进 /user/verify/send 的响应里，
    # 省得每次去翻后端日志。线上不要开（默认 false，prod 也没有这个键）。
    dev-echo: ${MAIL_DEV_ECHO:false}
  captcha:
    # 同上的本地调试开关：把图形验证码明文放进 /captcha 的响应里，
    # 这样注册流程能被脚本自动验收。线上不设这个键，恒为 false。
    # ⚠️ 打开等于取消图形验证码，只允许出现在本地配置里。
    dev-echo: ${CAPTCHA_DEV_ECHO:false}

server:
  port: 8080

spring:
  profiles:
    # 本地开发默认加载 application-local.yaml（放在 springboot/kokomi/config/ 下，
    # 含本机数据库密码，不入库）。线上用 --spring.profiles.active=prod 显式指定，
    # default 不会生效。
    default: local
  application:
    name: kokomi
  servlet:
    multipart:
      max-file-size: 10MB          # 单个文件最大 10MB
      max-request-size: 10MB      # 整个请求最大 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 凭据一律走环境变量，仓库里不留明文密码
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://localhost:3306/kokomi?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    hikari:
      connection-test-query: SELECT 1
      max-lifetime: 1800000

  # 验证码邮件通道：阿里云邮件推送（DirectMail）的 SMTP。
  #
  # 它不是一套独立的 SDK —— 阿里云文档给的示例就是标准 JavaMail 的
  # Session + Transport.send，底层协议完全一样。这里继续用 Spring 的
  # JavaMailSender（Spring Boot 4 下是 jakarta.mail），而不是文档里的
  # com.sun.mail:javax.mail —— 后者是 javax 包名，和 jakarta.mail 会冲突。
  #
  # 用前必须在阿里云控制台做完三步，少一步就会 535/554 发不出去：
  #   1. 邮件推送 → 发信域名：添加域名并按提示配好 DNS（SPF / MX / DKIM 验证）
  #   2. 发信地址：在该域名下新建一个，如 noreply@mail.example.com
  #   3. 该发信地址 → 设置 SMTP 密码（不是阿里云登录密码，也不是 AccessKey）
  # 然后 MAIL_USERNAME 填这个发信地址，MAIL_PASSWORD 填刚设的 SMTP 密码。
  #
  # 端口：465=SSL（推荐，阿里云 ECS 出方向 25 端口默认封禁，别用 25）；
  #       也行 80（明文），把 MAIL_SSL 设成 false。
  mail:
    host: ${MAIL_HOST:smtpdm.aliyun.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        # 长参数（附件名）不折行，阿里云示例里的 mail.mime.splitlongparameters=false
        mime:
          splitlongparameters: false
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}
          # 阿里云要求 SMTP 信封发件人（MAIL FROM）等于控制台创建的发信地址。
          # 缺省跟随 username，一般不用单独配；配了 MAIL_FROM 就以它为准。
          from: ${MAIL_FROM:${MAIL_USERNAME:}}
          # 跨境/弱网时卡住不如快点报错，让用户点重发
          connectiontimeout: 6000
          timeout: 8000
          writetimeout: 8000

# JWT 配置（标准写法：配置化）
jwt:
  # 生产环境必须通过 JWT_SECRET 覆盖；默认值仅用于本地开发
  secret: ${JWT_SECRET:kokomi_dev_only_secret_do_not_use_in_prod}
  #expire: 10000  # 10s 毫秒
  expire: 604800000  # 7天 毫秒

# 放行路径（白名单）
auth:
  excludePaths:
    - /captcha
    - /user/login
    - /user/register
    # 注册前发邮箱验证码：还没注册当然没有 token，必须免登录
    - /user/register/email-code
    # 注册第一步校验验证码换 ticket：同样还没有 token
    - /user/register/verify-email
    # 找回密码：登录不了才来这儿，必须免登录
    - /user/password/forgot/**
    - /publicKey
    - /upload/**
    - /post/getPosts
    - /post/getUserPosts
    - /post/stats
    - /topic/list
    # 角色字典：前台身份标签要把 roleCode 翻成中文，匿名访客也要能看到
    - /role/list
    - /comments
    - /user/profile/**

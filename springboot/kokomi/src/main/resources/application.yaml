app:
  base-url: http://localhost:8080
  upload-path: ${user.dir}/upload/
  mail:
    # 邮件里署的发件人名
    from-name: 心海的小窝
    # 本地开发用：SMTP 没配时，把验证码明文放进 /user/verify/send 的响应里，
    # 省得每次去翻后端日志。线上不要开（默认 false，prod 也没有这个键）。
    dev-echo: ${MAIL_DEV_ECHO:false}

server:
  port: 8080

spring:
  profiles:
    # 本地开发默认加载 application-local.yaml（放在 springboot/kokomi/config/ 下，
    # 含本机数据库密码，不入库）。线上用 --spring.profiles.active=prod 显式指定，
    # default 不会生效。
    default: local
  application:
    name: kokomi
  servlet:
    multipart:
      max-file-size: 10MB          # 单个文件最大 10MB
      max-request-size: 10MB      # 整个请求最大 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 凭据一律走环境变量，仓库里不留明文密码
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://localhost:3306/kokomi?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    hikari:
      connection-test-query: SELECT 1
      max-lifetime: 1800000

  # 注册验证码邮件。QQ 邮箱：设置 → 账户 → 开启 SMTP 服务 → 生成授权码（不是登录密码）。
  # 两个凭据都从环境变量读，仓库里不留明文；本地可以写在 gitignored 的
  # springboot/kokomi/config/application-local.yaml 里（同 datasource 的 password 一样）。
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # QQ/163 在境外机房偶尔很慢，卡住不如快点报错让用户点重发
          connectiontimeout: 6000
          timeout: 8000
          writetimeout: 8000

# JWT 配置（标准写法：配置化）
jwt:
  # 生产环境必须通过 JWT_SECRET 覆盖；默认值仅用于本地开发
  secret: ${JWT_SECRET:kokomi_dev_only_secret_do_not_use_in_prod}
  #expire: 10000  # 10s 毫秒
  expire: 604800000  # 7天 毫秒

# 放行路径（白名单）
auth:
  excludePaths:
    - /captcha
    - /user/login
    - /user/register
    - /publicKey
    - /upload/**
    - /post/getPosts
    - /post/getUserPosts
    - /post/stats
    - /topic/list
    # 角色字典：前台身份标签要把 roleCode 翻成中文，匿名访客也要能看到
    - /role/list
    - /comments
    - /user/profile/**
